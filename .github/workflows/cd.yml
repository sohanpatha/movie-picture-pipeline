name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: movie-picture-backend
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            ./starter/backend

          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

          docker tag \
            $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            $REGISTRY/$REPOSITORY:latest

          docker push $REGISTRY/$REPOSITORY:latest

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: movie-picture-frontend
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=http://a1b8186598bdc436aa86ad6d99471ecd-1611828878.us-east-1.elb.amazonaws.com \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            ./starter/frontend

          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

          docker tag \
            $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            $REGISTRY/$REPOSITORY:latest

          docker push $REGISTRY/$REPOSITORY:latest